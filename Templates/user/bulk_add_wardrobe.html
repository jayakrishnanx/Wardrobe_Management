{% extends 'user/base_dashboard.html' %}

{% block content %}
<div class="fade-in">
    <div class="page-header">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="page-title">📦 Bulk Add Items</h2>
                <p class="page-subtitle">Add multiple wardrobe items at once by uploading several images for a category.</p>
            </div>
            <a href="{% url 'add_wardrobe' %}" class="btn btn-secondary">+ Single Add</a>
        </div>
    </div>

    <form method="post" enctype="multipart/form-data" id="bulkForm">
        {% csrf_token %}

        <div class="card p-4 fade-in" style="margin-bottom: 1.5rem; border-left: 4px solid var(--primary-color);">
            <div class="row">
                <div class="col-md-6 form-group">
                    <label class="form-label">Category *</label>
                    <select name="category" class="form-control" required>
                        <option value="">Select category</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 form-group">
                    <label class="form-label">Images (Bulk Upload) *</label>
                    <input type="file" name="images" class="form-control" accept="image/*" multiple required onchange="updateImageCount(this)">
                    <small class="text-muted d-block mt-2" id="image-count-label">You can select multiple images at once.</small>
                </div>
            </div>
            <div class="form-actions mt-4 text-center" style="display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-primary btn-block px-5" id="submitBtn">
                    📦 Add Items
                </button>
                <a href="{% url 'wardrobe_home' %}" class="btn btn-secondary btn-block mt-2">Cancel</a>
            </div>
        </div>
    </form>
</div>

<script>
    function updateImageCount(input) {
        const count = input.files ? input.files.length : 0;
        const label = document.getElementById('image-count-label');
        const submitBtn = document.getElementById('submitBtn');
        
        if (count > 0) {
            label.textContent = `${count} image${count > 1 ? 's' : ''} selected.`;
            label.style.color = "var(--primary-color)";
            submitBtn.textContent = `📦 Add ${count} Item${count > 1 ? 's' : ''}`;
        } else {
            label.textContent = "You can select multiple images at once.";
            label.style.color = "";
            submitBtn.textContent = "📦 Add Items";
        }
    }
</script>
{% endblock %}
