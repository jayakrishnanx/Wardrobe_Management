<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Auth{% endblock %} - Wardrobe Manager</title>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Main CSS -->
    {% load static %}
    <link rel="icon" type="image/png" href="{% static 'assets/img/favicon.png' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}?v=6">

</head>

<body class="auth-body">
    <!-- Animated Background Elements -->
    <div id="three-bg"></div>

    <!-- Big Heading -->
    <div class="auth-page-heading">
        <h1 class="auth-main-title">Curate Your Style</h1>
        <p class="auth-main-subtitle">Manage your wardrobe with AI-powered precision</p>
    </div>

    <div class="auth-container">
        <!-- Left Side - Branding -->
        <div class="auth-branding">
            <div class="auth-branding-content">
                <div class="auth-logo-icon">👗</div>
                <h1 class="auth-branding-title">Wardrobe Manager</h1>
                <p class="auth-branding-subtitle">Your personal style companion for organizing, planning, and elevating
                    your wardrobe.</p>


            </div>
        </div>

        <!-- Right Side - Form -->
        <div class="auth-card">
            <div class="auth-card-inner">
                <div class="auth-brand-mobile">👗 Wardrobe</div>
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
</body>

</html>
